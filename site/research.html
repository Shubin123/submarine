<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FVM vs LBM Research</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <article class="prose" id="doc"><p class="note">Loading the research note…</p></article>
</main>
<script type="module">
import { chrome } from './assets/ui.js';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js';
chrome('.');
const doc = document.getElementById('doc');
try {
  const res = await fetch('research.md');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  doc.innerHTML = marked.parse(await res.text());
  for (const t of doc.querySelectorAll('table')) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.replaceWith(wrap);
    wrap.append(t);
  }
} catch (err) {
  doc.innerHTML = `<p class="status bad">Could not load the note (${err.message}). Read it on <a href="https://github.com/Shubin123/submarine/blob/main/research.md">GitHub</a>.</p>`;
}
</script>
</body>
</html>
